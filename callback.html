<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipHunter Studio - sign-in redirect</title></head>
<body style="font-family:system-ui,Arial,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem">
<h1>ClipHunter Studio</h1>
<p id="m">Returning to the app on your computer...</p>
<script>
// Forwards the OAuth result (code/state/error) to the desktop app on the user's own computer. Nothing is stored or sent elsewhere.
(function () {
  var p = new URLSearchParams(location.search), out = new URLSearchParams();
  ["code", "state", "error", "error_description", "scopes"].forEach(function (k) { if (p.has(k)) out.set(k, p.get(k)); });
  if (!out.has("code") && !out.has("error")) { document.getElementById("m").textContent = "No sign-in data found. Start the login from the app."; return; }
  location.replace("http://localhost:8000/api/tiktok/auth/callback?" + out.toString());
})();
</script>
</body></html>
